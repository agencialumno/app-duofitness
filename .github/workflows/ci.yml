name: ci

on:
  pull_request:
    branches: [release-teste, main]
  push:
    branches: [release-teste, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # App (raiz do repositório): Expo SDK 54.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22 # RN 0.81 (Expo SDK 54) exige Node >= 20.19.4
          cache: npm
          cache-dependency-path: package-lock.json
      # Falha em segundos se algum PNG estiver fora do padrão que o build Android aceita.
      - run: node scripts/check-pngs.mjs
      # Falha em segundos se um vídeo/capa de exercício estiver fora do padrão (docs/videos-exercicios.md).
      - run: node scripts/check-videos.mjs
      # Falha se google-services.json, GoogleService-Info.plist, chave de conta de serviço, chave privada ou chave AIza estiverem versionados.
      - run: node scripts/check-no-secrets.mjs
      - run: npm ci
      # Falha se expo-file-system, expo-asset, expo-font ou expo-keep-awake ficarem fora do
      # autolinking (por exemplo, aninhados em node_modules/expo/node_modules).
      - run: node scripts/check-autolinking.mjs
      - run: node scripts/check-autolinking.mjs --platform ios
      - run: npx expo-doctor
      # A raiz ainda não tem lint nem testes; --if-present roda quando existirem.
      - run: npm run --if-present lint
      - run: npm run --if-present test

  # Backend (backend/): projeto separado, com package.json e lockfile próprios.
  # Gera o projeto iOS (expo prebuild) em Linux, sem compilar: o prebuild iOS não roda no Windows,
  # então esta é a checagem de que a configuração iOS do app gera o projeto sem erro. O build
  # assinado fica no ios.yml (macOS).
  ios-prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Gerar projeto iOS (expo prebuild)
        run: npx expo prebuild --platform ios --no-install
      - name: Conferir que o projeto iOS foi gerado
        run: |
          set -uo pipefail
          echo "::group::Conteúdo de ios/ (só nomes)"
          ls -la ios || true
          ls -d ios/*.xcodeproj ios/*.xcworkspace 2>&1 || true # o .xcworkspace só nasce no pod install (macOS)
          echo "::endgroup::"
          node scripts/check-ios-project.mjs --bundle-id com.duofitness.app
      # Sem Firebase, o Podfile fica como o template do Expo (nenhum marcador, nenhuma propriedade de frameworks estáticos).
      - name: Conferir que o Podfile está SEM Firebase
        run: node scripts/check-firebase-podfile.mjs --expect-absent

  # Gera o projeto iOS COM Firebase em Linux (arquivo de configuração FALSO, sem secrets) e confere o Podfile: remédio do RNFB
  # (forceStaticLinking), sintaxe Ruby e idempotência do plugin. Não compila (isso é o ios.yml/firebase-spike em macOS).
  ios-prebuild-firebase:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Configuração FALSA do Firebase (só para o prebuild)
        run: |
          set -euo pipefail
          mkdir -p .firebase-config
          cat > .firebase-config/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CLIENT_ID</key><string>000000000000-ci.apps.googleusercontent.com</string>
          <key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.000000000000-ci</string>
          <key>API_KEY</key><string>CI-NOT-A-REAL-KEY</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>PLIST_VERSION</key><string>1</string>
          <key>BUNDLE_ID</key><string>com.duofitness.app</string>
          <key>PROJECT_ID</key><string>ci-project</string>
          <key>STORAGE_BUCKET</key><string>ci-project.appspot.com</string>
          <key>IS_ADS_ENABLED</key><false/><key>IS_ANALYTICS_ENABLED</key><false/><key>IS_APPINVITE_ENABLED</key><true/><key>IS_GCM_ENABLED</key><true/><key>IS_SIGNIN_ENABLED</key><true/>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          </dict></plist>
          PLIST
          echo "FIREBASE_ENABLED=true" >> "$GITHUB_ENV"
          echo "FIREBASE_IOS_CONFIG=$PWD/.firebase-config/GoogleService-Info.plist" >> "$GITHUB_ENV"
      - name: Instalar os módulos de conta (grava no package.json do runner)
        run: node scripts/install-firebase-deps.mjs
      - name: Conferir autolinking do iOS com os módulos de conta
        run: node scripts/check-autolinking.mjs --platform ios
      - name: Gerar projeto iOS com Firebase (expo prebuild)
        run: npx expo prebuild --platform ios --no-install
      - name: Conferir o Podfile do Firebase (forceStaticLinking e plugin)
        run: node scripts/check-firebase-podfile.mjs
      # Com FIREBASE_ENABLED=true (definido acima) esta checagem também exige o URL scheme do Google (REVERSED_CLIENT_ID) no
      # Info.plist gerado, o mesmo que o ios.yml confere no Mac. Antes este job não rodava o check-ios-project e não reproduzia o erro.
      - name: Conferir o projeto iOS gerado (inclui o URL scheme do Google)
        run: node scripts/check-ios-project.mjs --bundle-id com.duofitness.app
      - name: Sintaxe Ruby do Podfile
        run: ruby -c ios/Podfile
      - name: Idempotência (prebuild de novo, sem --clean, não duplica o Podfile)
        run: |
          npx expo prebuild --platform ios --no-install
          node scripts/check-firebase-podfile.mjs
      - name: Apagar a configuração falsa
        if: always()
        run: node scripts/firebase-prepare.mjs cleanup

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Os testes injetam a própria configuração e uma Anthropic falsa. Estas
    # variáveis são FALSAS e só existem para garantir que nada real é usado.
    env:
      ANTHROPIC_API_KEY: sk-ant-fake-ci
      ANTHROPIC_MODEL: fake-model
      MODEL_INPUT_USD_PER_MTOK: '1'
      MODEL_OUTPUT_USD_PER_MTOK: '1'
      APP_KEY: fake-app-key
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Falha se backend/src/ia/catalog.ts estiver desatualizado em relação ao app.
      - run: npm run check-catalog
      - run: npx vitest run
