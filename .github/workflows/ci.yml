name: ci

on:
  pull_request:
    branches: [release-teste, main]
  push:
    branches: [release-teste, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # App (raiz do repositório): Expo SDK 54.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22 # RN 0.81 (Expo SDK 54) exige Node >= 20.19.4
          cache: npm
          cache-dependency-path: package-lock.json
      # Falha em segundos se algum PNG estiver fora do padrão que o build Android aceita.
      - run: node scripts/check-pngs.mjs
      - run: npm ci
      # Falha se expo-file-system, expo-asset, expo-font ou expo-keep-awake ficarem fora do
      # autolinking (por exemplo, aninhados em node_modules/expo/node_modules).
      - run: node scripts/check-autolinking.mjs
      - run: npx expo-doctor
      # A raiz ainda não tem lint nem testes; --if-present roda quando existirem.
      - run: npm run --if-present lint
      - run: npm run --if-present test

  # Backend (backend/): projeto separado, com package.json e lockfile próprios.
  # Gera o projeto iOS (expo prebuild) em Linux, sem compilar: o prebuild iOS não roda no Windows,
  # então esta é a checagem de que a configuração iOS do app gera o projeto sem erro. O build
  # assinado fica no ios.yml (macOS).
  ios-prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Gerar projeto iOS (expo prebuild)
        run: npx expo prebuild --platform ios --no-install
      - name: Conferir que o projeto iOS foi gerado
        run: |
          set -euo pipefail
          test -d ios || { echo "::error::A pasta ios/ não foi gerada pelo prebuild."; exit 1; }
          test -f ios/Podfile || { echo "::error::ios/Podfile não foi gerado."; exit 1; }
          XCODEPROJ="$(find ios -maxdepth 1 -name '*.xcodeproj' | head -1)"
          test -n "$XCODEPROJ" || { echo "::error::Nenhum .xcodeproj em ios/."; exit 1; }
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.duofitness.app" "$XCODEPROJ/project.pbxproj"             || { echo "::error::O bundle id com.duofitness.app não está no projeto iOS."; exit 1; }
          PLIST="$(find ios -maxdepth 2 -name Info.plist | head -1)"
          test -n "$PLIST" || { echo "::error::Info.plist não encontrado em ios/."; exit 1; }
          grep -A1 "ITSAppUsesNonExemptEncryption" "$PLIST" | grep -q "<false/>"             || { echo "::error::ITSAppUsesNonExemptEncryption deveria ser false no Info.plist."; exit 1; }
          echo "Projeto iOS gerado: $XCODEPROJ"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Os testes injetam a própria configuração e uma Anthropic falsa. Estas
    # variáveis são FALSAS e só existem para garantir que nada real é usado.
    env:
      ANTHROPIC_API_KEY: sk-ant-fake-ci
      ANTHROPIC_MODEL: fake-model
      MODEL_INPUT_USD_PER_MTOK: '1'
      MODEL_OUTPUT_USD_PER_MTOK: '1'
      APP_KEY: fake-app-key
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Falha se backend/src/ia/catalog.ts estiver desatualizado em relação ao app.
      - run: npm run check-catalog
      - run: npx vitest run
