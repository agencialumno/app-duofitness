name: backend

on:
  push:
    paths:
      - 'backend/**'
      - 'src/utils/workoutGenerator.js'
      - 'src/utils/imc.js'
      - 'src/data/combosEquipment.js'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'src/utils/workoutGenerator.js'
      - 'src/utils/imc.js'
      - 'src/data/combosEquipment.js'
      - '.github/workflows/backend.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Falha se backend/src/ia/catalog.ts estiver desatualizado em relação ao app.
      - run: npm run check-catalog
      - run: npm test
