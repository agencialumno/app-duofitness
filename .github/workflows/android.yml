# Build Android (APK + AAB) assinado, fora do EAS.
#
# - Dispara ao subir uma tag "v*" (ex: v0.1.0) ou manualmente (workflow_dispatch).
# - Projeto nativo gerado por "expo prebuild" (android/ fica fora do git).
# - Assinatura e versão vêm do plugin plugins/withAndroidRelease.js, por variáveis de ambiente.
# - Guia completo (keystore, secrets, tag): docs/android.md.
#
# NÃO RENOMEIE ESTE ARQUIVO: o versionCode usa github.run_number, que é contado por arquivo de
# workflow. Renomear reinicia a contagem e a Play Store recusa versionCode menor.
name: android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ABIs do APK e do AAB. Para emulador x86_64 ou para a Play Store, veja docs/android.md.
  ANDROID_ABIS: arm64-v8a,armeabi-v7a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # OPCIONAIS: sem elas o build segue e o app fica 100% offline.
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_APP_KEY: ${{ secrets.EXPO_PUBLIC_APP_KEY }}
      # Variável (não secret) do repositório: o número vai dentro do app, qualquer pessoa consegue ler. Opcional.
      EXPO_PUBLIC_MARKETPLACE_WHATSAPP: ${{ vars.EXPO_PUBLIC_MARKETPLACE_WHATSAPP }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Versão (versionName da tag, versionCode = run_number)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A tag não segue o padrão vMAJOR.MINOR.PATCH (ex: v0.1.0)."
              exit 1
            fi
            VERSION_NAME="${REF_NAME#v}"
          else
            # execução manual, sem tag: usa a versão do app.json
            VERSION_NAME="$(node -p "require('./app.json').expo.version")"
          fi
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$RUN_NUMBER" >> "$GITHUB_ENV"

          if [ -n "${EXPO_PUBLIC_API_URL:-}" ]; then API="sim"; else API="não (app 100% offline)"; fi
          if [ -n "${EXPO_PUBLIC_APP_KEY:-}" ]; then KEY="sim"; else KEY="não"; fi
          if [ -n "${EXPO_PUBLIC_MARKETPLACE_WHATSAPP:-}" ]; then WPP="sim"; else WPP="não"; fi
          {
            echo "## Build Android"
            echo ""
            echo "- versionName: \`$VERSION_NAME\`"
            echo "- versionCode: \`$RUN_NUMBER\`"
            echo "- ABIs configuradas: \`$ANDROID_ABIS\`"
            echo "- URL da API embutida no app: **$API**"
            echo "- APP_KEY embutida no app: **$KEY**"
            echo "- WhatsApp da loja embutido: **$WPP**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir secrets de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            list="$(printf '%s, ' "${missing[@]}")"
            list="${list%, }"
            echo "::error::Faltam secrets de assinatura: $list. Cadastre em Settings > Secrets and variables > Actions (veja docs/android.md)."
            {
              echo ""
              echo "### Build interrompido: faltam secrets de assinatura"
              echo ""
              echo "Secrets ausentes: \`$list\`. Veja \`docs/android.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # React Native 0.81 (Expo SDK 54) exige Node >= 20.19.4. Usamos o Node 22 (LTS), já que o 20
      # saiu de suporte; o passo seguinte confere a versão mínima.
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Conferir versão do Node (>= 20.19.4)
        run: |
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number); const ok=a>20||(a===20&&(b>19||(b===19&&c>=4))); console.log('Node '+process.versions.node); if(!ok){console.error('::error::Node >= 20.19.4 é exigido pelo React Native 0.81.');process.exit(1)}"

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      # ---- Checagens rápidas: falham em segundos, ANTES do cache, do npm ci e do Gradle ----

      - name: Conferir PNGs do app (assinatura PNG, CRC, 8 bits, sem entrelaçamento)
        run: node scripts/check-pngs.mjs

      - name: Conferir vídeos e capas dos exercícios (extensão, formato real, nome, tamanho, mapa em dia)
        run: node scripts/check-videos.mjs

      - name: Decodificar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/duofitness-release.keystore"
          # registra o caminho antes de criar o arquivo, para o passo final de limpeza achar
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 não é um base64 válido (veja docs/android.md)."
            exit 1
          fi
          chmod 600 "$KEYSTORE"

      # Abre o keystore e extrai a chave com as senhas dos secrets, exatamente o que o Gradle fará.
      # As senhas só passam por variáveis de ambiente (keytool :env) e a saída do keytool nunca é
      # impressa: ela só serve para descobrir QUAL secret está errado.
      - name: Validar keystore (alias, senha do keystore e senha da chave)
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # O shell dos passos do Actions é "bash -e": sem "set +e" o keytool com erro encerrava o
          # passo no "OUT=$(keytool ...)", antes de ler o código e de dizer QUAL secret está errado.
          set +e
          set -uo pipefail
          CHECK="$RUNNER_TEMP/keycheck.p12"
          rm -f "$CHECK"

          fail() {
            echo "::error::$1"
            {
              echo ""
              echo "### Build interrompido: keystore inválido"
              echo ""
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # senha descartável do arquivo temporário de destino (não é nenhuma das suas senhas)
          CHECK_DEST_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$CHECK_DEST_PASS"
          export CHECK_DEST_PASS

          # -J-Duser.language=en: mensagens do keytool em inglês, para a classificação abaixo não
          # depender do idioma do sistema.
          OUT="$(keytool -J-Duser.language=en -J-Duser.country=US -importkeystore -noprompt \
            -srckeystore "$ANDROID_KEYSTORE_FILE" -srcalias "$ANDROID_KEY_ALIAS" \
            -srcstorepass:env ANDROID_KEYSTORE_PASSWORD -srckeypass:env ANDROID_KEY_PASSWORD \
            -destkeystore "$CHECK" -deststoretype PKCS12 \
            -deststorepass:env CHECK_DEST_PASS -destkeypass:env CHECK_DEST_PASS 2>&1)"
          RC=$?

          if [ "$RC" -ne 0 ]; then
            if printf '%s' "$OUT" | grep -qiE 'password was incorrect|tampered'; then
              fail "A senha do keystore não confere. Atualize o secret ANDROID_KEYSTORE_PASSWORD."
            elif printf '%s' "$OUT" | grep -qiE 'alias.*does not exist'; then
              fail "O alias não existe no keystore. Atualize o secret ANDROID_KEY_ALIAS (maiúsculas e minúsculas contam)."
            elif printf '%s' "$OUT" | grep -qiE 'cannot recover key|get key failed|unrecoverablekey'; then
              fail "A senha da chave não confere. Atualize o secret ANDROID_KEY_PASSWORD."
            elif printf '%s' "$OUT" | grep -qiE 'unrecognized keystore format|invalid keystore format|keystore file (does not exist|exists, but is empty)|not a valid|DerInputStream|Short read|ParseException'; then
              fail "O keystore não pôde ser lido (formato inválido ou arquivo corrompido). Gere o base64 de novo e atualize o secret ANDROID_KEYSTORE_BASE64."
            else
              fail "O keytool não conseguiu extrair a chave (causa não identificada). Confira ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_PASSWORD."
            fi
          fi

          # Em keystore PKCS12 o keytool IGNORA a senha da chave informada; o Gradle, não. Por isso
          # conferimos aqui que as duas senhas são iguais. O tipo vem dos primeiros bytes do
          # arquivo (JKS começa com FEEDFEED e JCEKS com CECECECE; o resto legível é PKCS12), sem
          # depender do texto do keytool.
          MAGIC="$(od -An -tx1 -N4 "$ANDROID_KEYSTORE_FILE" | tr -d ' \n')"
          case "$MAGIC" in
            feedfeed|cececece) TYPE="JKS" ;;
            *) TYPE="PKCS12" ;;
          esac
          if [ "$TYPE" = "PKCS12" ] && [ "$ANDROID_KEYSTORE_PASSWORD" != "$ANDROID_KEY_PASSWORD" ]; then
            fail "Em keystore PKCS12 as senhas do keystore e da chave precisam ser iguais. Atualize ANDROID_KEY_PASSWORD com o mesmo valor de ANDROID_KEYSTORE_PASSWORD."
          fi
          echo "Keystore válido (tipo $TYPE); alias e senhas conferem."

      # Cache do Gradle. Não usamos "cache: gradle" do setup-java porque ele exige arquivos
      # .gradle já presentes, e o android/ só existe depois do prebuild.
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: npm ci

      - name: Gerar projeto Android (expo prebuild)
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          # confere que o plugin aplicou versão e assinatura
          grep -q "versionCode $ANDROID_VERSION_CODE\$" android/app/build.gradle
          grep -q "versionName \"$APP_VERSION_NAME\"" android/app/build.gradle
          grep -q "withAndroidRelease" android/app/build.gradle
          # registra o Gradle do wrapper gerado (o template do Expo SDK 54 usa o 8.14.x; JDK 17 serve)
          GRADLE_VER="$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties | head -1)"
          echo "Gradle do wrapper: $GRADLE_VER"
          echo "- Gradle (wrapper gerado): \`$GRADLE_VER\`" >> "$GITHUB_STEP_SUMMARY"

      # O autolinking só enxerga node_modules do topo. Módulo aninhado (como aconteceu com o
      # expo-file-system no SDK 52) fica fora do app e quebra o carregamento da fonte dos ícones.
      - name: Conferir autolinking (módulos Expo obrigatórios)
        run: node scripts/check-autolinking.mjs

      - name: Build (APK e AAB)
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            -PreactNativeArchitectures="$ANDROID_ABIS" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --no-daemon --stacktrace

      - name: Conferir e reunir os arquivos
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK" && test -f "$AAB"

          mkdir -p release-out
          cp "$APK" "release-out/duofitness-$APP_VERSION_NAME.apk"
          cp "$AAB" "release-out/duofitness-$APP_VERSION_NAME.aab"
          echo "APK_PATH=$GITHUB_WORKSPACE/release-out/duofitness-$APP_VERSION_NAME.apk" >> "$GITHUB_ENV"

          # a assinatura precisa ser a do keystore de release, nunca a de debug
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::O APK foi assinado com a chave de DEBUG, não com o keystore de release."
            exit 1
          fi
          SHA="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')"
          ABIS_FOUND="$(unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u | paste -sd, -)"
          SIZE="$(du -h "$APK" | cut -f1)"
          {
            echo "- ABIs no APK (conferido): \`$ABIS_FOUND\`"
            echo "- Tamanho do APK: $SIZE"
            echo "- Assinatura verificada (SHA-256 do certificado): \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: duofitness-android-${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: |
            release-out/*.apk
            release-out/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Vercel Blob habilitado?
        id: blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "- Vercel Blob: pulado (secret BLOB_READ_WRITE_TOKEN não configurado)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar APK no Vercel Blob
        if: steps.blob.outputs.enabled == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERSION_NAME: ${{ env.APP_VERSION_NAME }}
        run: |
          set -euo pipefail
          # @vercel/blob fica numa pasta temporária: não entra no package.json do app
          PUB="$RUNNER_TEMP/blobpub"
          mkdir -p "$PUB"
          cp scripts/publish-apk.mjs "$PUB/"
          (cd "$PUB" && npm init -y > /dev/null && npm install @vercel/blob@2.8.2 --no-audit --no-fund --loglevel=error)
          OUT="$(cd "$PUB" && node publish-apk.mjs)"
          get() { printf '%s\n' "$OUT" | sed -n "s/^$1=//p"; }
          {
            echo ""
            echo "### Downloads (Vercel Blob, público)"
            echo ""
            echo "- Última versão: $(get latest_download_url)"
            echo "- Esta versão (\`$VERSION_NAME\`): $(get versioned_download_url)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sempre apaga o keystore decodificado e o arquivo temporário da validação, mesmo se algum
      # passo acima falhar.
      - name: Apagar keystore decodificado e arquivo temporário da validação
        if: always()
        run: |
          rm -f "${ANDROID_KEYSTORE_FILE:-$RUNNER_TEMP/duofitness-release.keystore}"
          rm -f "$RUNNER_TEMP/keycheck.p12"
